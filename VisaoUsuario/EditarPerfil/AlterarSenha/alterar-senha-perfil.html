<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha</title>

    <link rel="stylesheet" href="../../../styles/global.css">
    <link rel="stylesheet" href="alterar-senha-perfil.css">

    <link rel="shortcut icon" href="../../../imgs/Icone - Bibliotec.png" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="pagina-listagem">

    <aside class="menu-lateral">

        <div class="topo-menu">

            <button class="botao-voltar">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <img class="logo" src="../../../imgs/Logo Vertical - clara.svg" alt="">

        </div>

        <nav class="menu-navegacao">

            <a href="../../EditarPerfil/editar-perfil.html" class="item-menu ativo">
                <i class="fa-solid fa-user"></i>
                <span>Perfil</span>
            </a>

            <a href="../../ListagemLivros/listagem-livros.html" class="item-menu">
                <i class="fa-solid fa-book-bookmark"></i>
                <span>Listar Livros</span>
            </a>

            <a href="../../LivrosFavoritos/livros-favoritos.html" class="item-menu">
                <i class="fa-solid fa-address-book"></i>
                <span>Favoritos</span>
            </a>

        </nav>

        <a href="../../../home/home.html" class="botao-sair">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Sair</span>
        </a>

    </aside>

    <main class="conteudo-listagem">

        <section class="cabecalho-pagina">
            <h1>Alterar senha</h1>
            <p>Atualize sua senha para manter a sua conta segura</p>
        </section>

        <section class="card-listagem">

            <div class="aviso-identidade">

                <div class="icone-identidade">
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="informacoes-identidade">

                    <h2>Confirme sua identidade</h2>

                    <p>Enviamos um código de verificação para o seu e-mail</p>

                    <p class="negrito">joao.silva@email.com</p>

                </div>

            </div>

            <form class="formulario-senha">

                <div class="campo-senha">
                    <label for="codigo">Código de verificação</label>
                    <input type="text" id="codigo" placeholder="Digite o código recebido" required>
                </div>

                <div class="campo-senha">
                    <label for="nova-senha">Nova senha</label>
                    <input type="password" id="nova-senha" placeholder="Digite sua nova senha" required>
                </div>

                <div class="campo-senha">
                    <label for="confirmar-senha">Confirmar nova senha</label>
                    <input type="password" id="confirmar-senha" placeholder="Confirme sua nova senha" required>
                </div>

                <div class="area-salvar-senha">
                    <button type="submit" class="botao-salvar-senha">SALVAR</button>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
